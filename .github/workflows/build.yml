name: Build crosvm + DroidVM APK

on:
  workflow_dispatch:

jobs:
  build-crosvm:
    runs-on: self-hosted
    steps:
      - name: Checkout meta repo
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Repo init
        run: |
          cd meta
          if ! [ -d "crosvm_build" ]; then
            mkdir -p crosvm_build
            cd crosvm_build
            git config --global url.https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/.insteadof https://android.googlesource.com
            repo init -u https://github.com/Droid-VM/crosvm-minimal-manifest.git \
              -b droidvm -m crosvm-minimal.xml --depth 1
           fi

      - name: Repo sync
        run: |
          cd meta/crosvm_build
          repo sync -c --no-tags -j4

      - name: Checkout Droid-VM forks
        run: |
          cd meta
          for p in external/crosvm hardware/google/gfxstream external/virglrenderer \
                   packages/modules/Virtualization external/libvncserver external/zstd; do
            name=$(basename "$p")
            dir="crosvm_build/$p"
            if [ -d "$dir" ]; then
              if [ "$name" = "crosvm" ]; then
                url="https://github.com/Alhkxsj/crosvm.git"
              else
                url="https://github.com/Droid-VM/$name.git"
              fi
              git -C "$dir" remote add droidvm "$url" 2>/dev/null || true
              git -C "$dir" fetch -q droidvm droidvm
              git -C "$dir" checkout -q -B droidvm FETCH_HEAD
            fi
          done

      - name: Build boot shim
        run: |
          cd meta/crosvm_build/external/crosvm/droidvm-shim
          cargo build --release --target aarch64-unknown-none-softfloat
          mkdir -p ../out/shim
          cp target/aarch64-unknown-none-softfloat/release/droidvm-shim ../out/shim/shim.elf
          aarch64-linux-gnu-objcopy -O binary ../out/shim/shim.elf ../out/shim/shim.bin
          cp ../out/shim/shim.bin ../hypervisor/src/gunyah/shim.bin

      - name: Build crosvm
        run: |
          cd meta/crosvm_build
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng
          ALLOW_MISSING_DEPENDENCIES=true TARGET_BUILD_UNBUNDLED=true m crosvm_device_only -j2

      - name: Collect crosvm
        run: |
          cd meta/crosvm_build
          mkdir -p crosvm_out
          BIN=$(find out/soong/.intermediates/external/crosvm/crosvm_device_only/crosvm_device_only_bin \
                -name crosvm 2>/dev/null | grep -v unstripped | head -1)
          [ -n "$BIN" ] || { echo "ERROR: crosvm not found"; exit 1; }
          cp -f "$BIN" crosvm_out/crosvm

          RE=$(find prebuilts/clang/host/linux-x86 -name llvm-readelf 2>/dev/null | head -1)
          SKIP="libc.so libdl.so libm.so"
          needed() { "$RE" -d "$1" 2>/dev/null | awk -F'[][]' '/NEEDED/{print $2}'; }
          findso() { find out/soong/.intermediates -path "*android_arm64*_shared*" -name "$1" 2>/dev/null \
                     | grep -v unstripped | head -1; }
          declare -A seen
          queue=$(needed "$BIN")
          while [ -n "$queue" ]; do
            next=""
            for so in $queue; do
              case " $SKIP " in *" $so "*) continue;; esac
              [ -n "${seen[$so]:-}" ] && continue; seen[$so]=1
              src=$(findso "$so")
              if [ -n "$src" ]; then
                cp -f "$src" "crosvm_out/"
                next="$next $(needed "$src")"
              fi
            done
            queue="$next"
          done

      - name: Upload crosvm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crosvm_out
          path: meta/crosvm_build/crosvm_out/
          retention-days: 7
